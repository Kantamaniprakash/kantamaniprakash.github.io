name: CI
on:
  push:
    branches: ["master"]
  pull_request:
jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate HTML
        run: npx --yes html-validate@11 index.html
